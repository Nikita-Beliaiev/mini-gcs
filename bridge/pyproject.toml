[project]
name = "gcs-bridge"
version = "0.1.0"
description = "Bridge between the Mini GCS station and an ArduPilot autopilot over MAVLink"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mykyta Beliaiev" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14",
  "pymavlink>=2.4.50",
  "websockets>=17.4",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26",
  "mypy>=2.4",
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
]

[project.scripts]
gcs-bridge = "gcs_bridge.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcs_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "PL", "PTH"]
ignore = ["PLR0911", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pymavlink.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
